name: synchronize Go module files

on:
  push:
    branches:
      - codex/mss-knowledge-foundation

permissions:
  contents: write

jobs:
  tidy:
    if: >-
      github.repository == 'mss-boot-io/mss-knowledge' &&
      !contains(github.event.head_commit.message, '[skip module sync]')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact pushed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Regenerate canonical module files
        run: |
          set -eu
          rm -f go.sum
          go mod tidy

      - name: Commit canonical module files when changed
        run: |
          set -eu
          if git diff --quiet -- go.mod go.sum && ! git ls-files --others --exclude-standard -- go.sum | grep -q .; then
            echo "module files are already canonical"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum
          git commit -m 'build: synchronize Go module files [skip module sync]'
          git push origin HEAD:${GITHUB_REF_NAME}
