name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-quality:
    name: Go quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go module files
        run: sh scripts/verify-go-modules.sh

      - name: Check formatting
        run: make fmt-check

      - name: Run go vet
        run: make vet

      - name: Run unit tests
        run: make test

      - name: Run race tests
        run: make test-race

      - name: Build binaries
        run: make build

  postgres-migration:
    name: PostgreSQL migration up/down
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mss_knowledge
          POSTGRES_USER: mss_knowledge
          POSTGRES_PASSWORD: migration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mss_knowledge -d mss_knowledge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show PostgreSQL client version
        run: psql --version

      - name: Verify foundation migration and rollback
        env:
          DATABASE_URL: postgres://mss_knowledge:migration-test-only@127.0.0.1:5432/mss_knowledge?sslmode=disable
        run: sh scripts/verify-foundation-migration.sh

  postgres-integration:
    name: PostgreSQL control-plane integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mss_knowledge
          POSTGRES_USER: mss_knowledge
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mss_knowledge -d mss_knowledge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://mss_knowledge:integration-test-only@127.0.0.1:5432/mss_knowledge?sslmode=disable
        run: |
          psql -X "$DATABASE_URL" --set ON_ERROR_STOP=1 --file migrations/000001_foundation.up.sql
          psql -X "$DATABASE_URL" --set ON_ERROR_STOP=1 --file migrations/000002_ingestion_runtime.up.sql

      - name: Run PostgreSQL integration tests
        env:
          MSS_KNOWLEDGE_TEST_DATABASE_URL: postgres://mss_knowledge:integration-test-only@127.0.0.1:5432/mss_knowledge?sslmode=disable
        run: go test -tags=integration ./internal/adapters/postgres
