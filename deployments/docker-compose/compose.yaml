name: mss-knowledge

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mss_knowledge
      POSTGRES_USER: mss_knowledge
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mss_knowledge -d mss_knowledge"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    restart: unless-stopped

  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        TARGET: gateway
        VERSION: foundation
    environment:
      MSS_KNOWLEDGE_SERVICE_NAME: mss-knowledge-gateway
      MSS_KNOWLEDGE_ENVIRONMENT: development
      MSS_KNOWLEDGE_LOG_LEVEL: info
      MSS_KNOWLEDGE_HTTP_ADDRESS: :8080
      MSS_KNOWLEDGE_DATABASE_URL: postgres://mss_knowledge:local-development-only@postgres:5432/mss_knowledge?sslmode=disable
      MSS_KNOWLEDGE_REDIS_ADDRESS: redis:6379
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        TARGET: worker
        VERSION: foundation
    environment:
      MSS_KNOWLEDGE_SERVICE_NAME: mss-knowledge-worker
      MSS_KNOWLEDGE_ENVIRONMENT: development
      MSS_KNOWLEDGE_LOG_LEVEL: info
      MSS_KNOWLEDGE_DATABASE_URL: postgres://mss_knowledge:local-development-only@postgres:5432/mss_knowledge?sslmode=disable
      MSS_KNOWLEDGE_REDIS_ADDRESS: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
